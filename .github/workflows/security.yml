name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      full_git_history:
        description: "Scan full git history for secrets with Gitleaks"
        required: false
        type: boolean
        default: false
      fail_on_severity:
        description: "Trivy failure severity threshold (comma-separated)"
        required: false
        type: string
        default: "HIGH,CRITICAL"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Secret Detection (Gitleaks)
  # Scans for exposed credentials, API keys, and sensitive tokens.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch full history so Gitleaks can resolve commit range diffs on both
          # push and pull_request events (as well as scheduled/manual full scans).
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          args: --verbose --redact

      - name: Upload Gitleaks SARIF Artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: gitleaks-sarif
          path: results.sarif
          retention-days: 14

      - name: Upload Gitleaks to GitHub Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@4c50b6f6fd9dc6fe03111c2d045c8be2a724cce1 # v3.28.11
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # Dependency Vulnerability & Misconfiguration Scanning (Trivy)
  # Language-agnostic scan across manifests (mix.lock, package-lock, etc.)
  # and configuration files (docker-compose, Dockerfiles, IaC).
  # ---------------------------------------------------------------------------
  dependency-iac-scan:
    name: Dependency & IaC Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Vulnerability & Misconfiguration Scan (Console)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: ${{ inputs.fail_on_severity || 'HIGH,CRITICAL' }}
          trivyignores: ".trivyignore"
          skip-dirs: "deps,_build,.git,tmp,priv/plts"
          format: "table"
          exit-code: "1"

      - name: Generate Trivy SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: ${{ inputs.fail_on_severity || 'HIGH,CRITICAL' }}
          trivyignores: ".trivyignore"
          skip-dirs: "deps,_build,.git,tmp,priv/plts"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"

      - name: Upload Trivy SARIF Artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

      - name: Upload Trivy to GitHub Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@4c50b6f6fd9dc6fe03111c2d045c8be2a724cce1 # v3.28.11
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # Static Application Security Testing (Semgrep SAST)
  # Analyzes source code for injection, unsafe deserialization, insecure crypto,
  # path traversal, and misconfigurations across all supported languages.
  # ---------------------------------------------------------------------------
  sast-scan:
    name: SAST Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.151.0@sha256:5930c9438968657745cc8c193e338ec9e08c5ead0b926b1b4ed37e06a9cc2270 \
            semgrep scan \
            --config auto \
            --config /src/scripts/ci/semgrep-guardrails.yaml \
            --sarif \
            --output /src/semgrep.sarif \
            --error \
            /src

      - name: Upload Semgrep SARIF Artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

      - name: Upload Semgrep to GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@4c50b6f6fd9dc6fe03111c2d045c8be2a724cce1 # v3.28.11
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # Container Image Build, Verification & Vulnerability Scan
  # Builds the production image, runs the 9-point security verification,
  # and scans for container CVEs via Trivy.
  # ---------------------------------------------------------------------------
  container-image:
    name: Container Image Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build production container image
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: phx_backend_boilerplate:verify
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert Target Architecture
        run: |
          arch=$(docker image inspect phx_backend_boilerplate:verify --format '{{.Architecture}}')
          if [ "$arch" != "amd64" ]; then
            echo "Expected architecture amd64, got $arch" >&2
            exit 1
          fi

      - name: Run Security Verification Suite
        run: ./scripts/docker-verify.sh phx_backend_boilerplate:verify

      - name: Scan Image for Vulnerabilities (Console)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: phx_backend_boilerplate:verify
          format: "table"
          severity: ${{ inputs.fail_on_severity || 'HIGH,CRITICAL' }}
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Generate Trivy Image SARIF Report
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: phx_backend_boilerplate:verify
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: ${{ inputs.fail_on_severity || 'HIGH,CRITICAL' }}
          trivyignores: ".trivyignore"
          exit-code: "0"

      - name: Upload Trivy Image SARIF Artifact
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 14

      - name: Upload Trivy Image to GitHub Code Scanning
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@4c50b6f6fd9dc6fe03111c2d045c8be2a724cce1 # v3.28.11
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
