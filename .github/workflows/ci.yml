name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phx_backend_boilerplate_test
        ports:
          - 5432:5432
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGPORT: "5432"
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/phx_backend_boilerplate_test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@923b52e23a738f55b8bcf966af7a1244f292dff0 # v1.18.2
        with:
          otp-version: "27"
          elixir-version: "1.20"

      - name: Restore dependencies cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore Dialyzer PLT cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: priv/plts
          key: ${{ runner.os }}-dialyzer-plt-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-plt-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-dialyzer-plt-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --min-priority high

      - name: Install Semgrep
        run: pip install semgrep==1.151.0

      - name: Semgrep guardrails (banned identifiers)
        run: ./scripts/ci/run-semgrep-guardrails.sh

      - name: Dialyzer
        run: mix dialyzer

      - name: Test
        run: mix test
