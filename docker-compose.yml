services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      # Host 5433 avoids conflicts with other local Postgres instances on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phx_backend_boilerplate_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ClamAV daemon (clamd). Uploads stream via TCP INSTREAM (fail-closed if down).
  # platform amd64: official image has no linux/arm64 manifest (Apple Silicon uses qemu).
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Community LocalStack: CloudWatch Logs + Metrics (X-Ray is Pro-only — use Jaeger).
  # For S3 file storage demos, set SERVICES to include s3 and STORAGE_BACKEND=s3.
  localstack:
    profiles: ["observability"]
    image: localstack/localstack:4.3
    ports:
      - "4566:4566"
    environment:
      SERVICES: logs,cloudwatch
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.66.0
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

volumes:
  redis_data:
  postgres_data:
  clamav_data:
  localstack_data:
